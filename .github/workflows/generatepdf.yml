name: Oltre il Chatbot - Generate PDF

on:
  push:
    branches: [ main ]
    paths:
      - '*.md'
      - '.github/workflows/generatepdf.yml'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Generate pdf
      run: |
        for deck in 'presentation.md' 'presentation30min.md'; do
          cp "$deck" "$deck.backup"
          sed -i "s/%date%/$(date +'%Y-%m-%d')/g" "$deck"
          sed -i "s/%time%/$(date +'%H:%M')/g" "$deck"
          npx @marp-team/marp-cli@latest "$deck" --pdf --allow-local-files --pdf-outlines --pdf-outlines.pages=false
          rm "$deck"
          mv "$deck.backup" "$deck"
        done

    - name: commit & push
      run: |
        git add -A
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .
        git commit -m "update slides"
        git push
